// 源码 CI 复用编译结果，但行为测试必须重新执行，不能用缓存 XML 代替本轮验证。
if (System.getenv('GYC_CI_BUILD_CACHE') == 'true') {
    gradle.startParameter.buildCacheEnabled = true
    gradle.beforeProject { project ->
        project.tasks.withType(org.gradle.api.tasks.testing.AbstractTestTask).configureEach {
            outputs.upToDateWhen { false }
            outputs.doNotCacheIf('CI must execute behavior tests') { true }
        }
    }
}

// GitHub-hosted runner 访问公开仓库；避免国内镜像 502 阻断 Gradle 的官方仓库解析。
gradle.settingsEvaluated { settings ->
    [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repositories ->
        repositories.removeAll { it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && it.url.host == 'maven.aliyun.com' }
        // Eazytec 只有部分上游 classifier；普通 AGP/AAPT 等必须从官方仓库完整解析。
        repositories.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).matching { it.url.host == 'maven.eazytec-cloud.com' }.all {
            content { includeVersionByRegex('.*', '.*', '.*-(1\\.0\\.0|1\\.1\\.0-04)') }
        }
    }
}
